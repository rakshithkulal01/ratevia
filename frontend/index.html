<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicons & App Icons (Official Ratevia Brand) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0052FF" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Metadata -->
    <title>Google Review QR Code for Business — Ratevia</title>
    <meta name="description" content="Create a custom Google Review QR code for your business. Ratevia's branded QR stands help cafés, restaurants, and hotels collect more authentic reviews. One-time payment, no subscription." />
    <link rel="canonical" href="https://ratevia.in/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ratevia" />
    <meta property="og:url" content="https://ratevia.in/" />
    <meta property="og:title" content="Google Review QR Code for Business — Ratevia" />
    <meta property="og:description" content="Create a custom Google Review QR code for your business. Ratevia's branded QR stands help cafés, restaurants, and hotels collect more authentic reviews. One-time payment, no subscription." />
    <meta property="og:image" content="https://ratevia.in/og-image.png" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ratevia" />
    <meta name="twitter:title" content="Google Review QR Code for Business — Ratevia" />
    <meta name="twitter:description" content="Create a custom Google Review QR code for your business. Ratevia's branded QR stands help cafés, restaurants, and hotels collect more authentic reviews. One-time payment, no subscription." />
    <meta name="twitter:image" content="https://ratevia.in/og-image.png" />

    <!-- Structured Data (Organization & WebSite) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://ratevia.in/#organization",
            "name": "Ratevia",
            "legalName": "Ratevia Technologies",
            "url": "https://ratevia.in",
            "logo": {
              "@type": "ImageObject",
              "url": "https://ratevia.in/favicon.svg"
            },
            "sameAs": [
              "https://twitter.com/ratevia",
              "https://www.linkedin.com/company/ratevia"
            ],
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "customer support",
              "url": "https://ratevia.in/contact"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://ratevia.in/#website",
            "name": "Ratevia",
            "url": "https://ratevia.in",
            "description": "Create a custom Google Review QR code for your business. Ratevia's branded QR stands help cafés, restaurants, and hotels collect more authentic reviews.",
            "publisher": {
              "@id": "https://ratevia.in/#organization"
            }
          }
        ]
      }
    </script>

    <!-- Google Fonts: Calistoga, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Calistoga&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-background text-foreground font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
